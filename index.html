<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/intro.css">
<link rel="stylesheet" href="css/content.css">
<title>Fish Pond</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>
<canvas id="pond"></canvas>
<canvas id="cursorOverlay"></canvas>
<button class="back-hint" id="backBtn">[ press esc to exit ]</button>

<div id="intro">
    <h1 class="title">still waters</h1>
    <div class="sub">a fish pond</div>
    <button class="enter-hint" id="enterBtn">[ press enter ]</button>
</div>

<div id="swirl">
  <svg viewBox="0 0 100 100" preserveAspectRatio="none">
    <defs>
      <filter id="swirlFilter">
        <feTurbulence id="turb" type="turbulence" baseFrequency="0.01" numOctaves="2" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>
</div>

<div id="project-overlay"></div>

<div id="content">
  <div class="panel">
    <h1 class="name"> fish </h1>
    <div class="role"> UW CS '31 &middot; they/them &middot; mossyfish</div>

    <section>
      <h2 class="section-title"> About </h2>
      <p class="body-text"> I'l add a description here one day in the future </p>
    </section>

    <section>
      <h2 class="section-title"> Photo album as of <span class="clock" id="liveClock"></span></h2>
      <br>
      <div class="carousel-viewport" id="carousel">
        <div class="carousel-track" id="carouselTrack"></div>
        <div class="carousel-fade left"></div>
        <div class="carousel-fade right"></div>
      </div>
    </section>
    
    <section> <h2 class="section-title"> LinkedIn </h2></section>
    <!-- this is gonna be so annoying-->

    <h3 class="section-title">Certifications</h3>
    <div class="cert-panel">
      <a class="cert-item" target="_blank">
        <img src="https://images.credly.com/size/128x128/images/683783d8-eaac-4c37-a14d-11bd8a36321d/ccna_600.png" alt="CCNA">
        <div class="cert-name">CCNA</div>
        <div class="cert-issuer">Cisco · 2026</div>
      </a>
      
      <a class="cert-item" target="_blank">
        <img src="https://images.credly.com/size/128x128/images/c60f9007-64bb-42ed-869b-e1f05d6d77f2/image.png" alt="CCNT">
        <div class="cert-name">CCST</div>
        <div class="cert-issuer">Cisco · 2026</div>
      </a>
    </div>
      
    <section> <h3 class="section-title">Volunteering </h3> </section>

    <section> <h3 class="section-title">Honors & Awards </h3> </section>
  </div>
</div>

<script src="scripts/render-water.js"></script>
<script src="scripts/render-koi.js"></script>
<script src="scripts/render-foliage.js"></script>
<script src="scripts/render-pond.js"></script>
<script src="scripts/transition.js"></script>
<script src="scripts/carousel.js"></script>
<script src="scripts/clock.js"></script>
<script type="text/javascript" async src="https://cdn.credly.com/assets/utilities/embed.js"></script>
</body>
</html>
